server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:supplier_sla}
    username: ${POSTGRES_USER:supplier_sla}
    password: ${POSTGRES_PASSWORD:supplier_sla_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  application:
    name: supplier-sla-platform
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
