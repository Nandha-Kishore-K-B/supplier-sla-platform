services:
  postgres:
    image: postgres:16
    container_name: supplier-sla-postgres
    environment:
      POSTGRES_DB: supplier_sla
      POSTGRES_USER: supplier_sla
      POSTGRES_PASSWORD: supplier_sla_dev
    ports:
      - "5432:5432"
    volumes:
      - supplier_sla_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier_sla -d supplier_sla"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supplier_sla_data:
